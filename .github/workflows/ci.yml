name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read
  packages: write

env:
  PYTHON_VERSION: "3.11"
  NODE_VERSION: "20"
  BACKEND_COVERAGE_THRESHOLD: "90.0"
  REGISTRY: ghcr.io

jobs:
  backend-test:
    name: Backend Tests (Python)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test_kagaz
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('backend/requirements.txt') }}
          restore-keys: ${{ runner.os }}-pip-

      - name: Install dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Lint with ruff
        working-directory: backend
        run: |
          pip install ruff
          ruff check . --exit-zero

      - name: Verify database migrations
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_kagaz
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: test
          MINIO_SECRET_KEY: test
        run: |
          alembic -c alembic.ini upgrade head
          alembic -c alembic.ini downgrade base
          alembic -c alembic.ini upgrade head

      - name: Verify resumable migration command
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_kagaz
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: test
          MINIO_SECRET_KEY: test
        run: python scripts/migrate_and_reindex.py --dry-run

      - name: Run tests with coverage
        working-directory: backend
        env:
          DATABASE_URL: postgresql+asyncpg://test:test@localhost:5432/test_kagaz
          REDIS_URL: redis://localhost:6379/0
          CELERY_BROKER_URL: redis://redis:6379/0
          CELERY_RESULT_BACKEND: redis://redis:6379/1
          GOOGLE_API_KEY: test-key
          CEREBRAS_API_KEY: test-key
          CEREBRAS_BASE_URL: https://api.cerebras.ai/v1
          OPENROUTER_API_KEY: test-openrouter-key
          OPENROUTER_BASE_URL: https://openrouter.ai/api/v1
          OPENAI_API_KEY: test-key
          CLERK_ISSUER: https://test.clerk.accounts.dev
          CLERK_JWKS_URL: https://test.clerk.accounts.dev/.well-known/jwks.json
          MINIO_ENDPOINT: localhost:9000
          MINIO_ACCESS_KEY: test
          MINIO_SECRET_KEY: test
          MINIO_BUCKET: test-bucket
          FAISS_INDEX_PATH: /tmp/faiss_test
        run: |
          pytest --cov=. --cov-report=xml --cov-report=term-missing -v --tb=short

      - name: Check coverage threshold
        working-directory: backend
        run: |
          COVERAGE=$(python -c "
          import xml.etree.ElementTree as ET
          tree = ET.parse('coverage.xml')
          root = tree.getroot()
          rate = float(root.attrib.get('line-rate', 0))
          print(f'{rate * 100:.1f}')
          ")
          echo "Coverage: ${COVERAGE}%"
          python -c "
          import sys
          coverage = float('${COVERAGE}')
          threshold = float('${{ env.BACKEND_COVERAGE_THRESHOLD }}')
          if coverage < threshold:
              print(f'Coverage {coverage}% is below {threshold}% threshold')
              sys.exit(1)
          print(f'Coverage {coverage}% meets {threshold}% threshold')
          "

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage.xml

  frontend-build:
    name: Frontend Build (Next.js)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-audit --fund=false

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:8000
          NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY: pk_test_placeholder
        run: npm run build

  docker-build:
    # One runner per image instead of three builds in series. Wall-clock is now
    # the slowest single image rather than their sum.
    name: Docker Build (${{ matrix.name }})
    runs-on: ubuntu-latest
    needs: [backend-test, frontend-build]

    strategy:
      fail-fast: true
      matrix:
        include:
          - name: backend
            dockerfile: backend/Dockerfile
          - name: worker
            dockerfile: backend/Dockerfile.worker
          - name: frontend
            dockerfile: Dockerfile

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx (enables BuildKit cache)
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare image name
        id: image
        run: |
          OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "ref=${{ env.REGISTRY }}/${OWNER}/docwise-${{ matrix.name }}" >> "$GITHUB_OUTPUT"

      # Build args only exist for the frontend; passing them to the Python images
      # would just make BuildKit warn about unconsumed args. Secrets are not
      # readable from `strategy`, so this cannot live in the matrix itself.
      - name: Resolve build args
        id: buildargs
        env:
          CLERK_KEY: ${{ secrets.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY || vars.NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY }}
          IS_PROD: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}
        run: |
          if [ "${{ matrix.name }}" = "frontend" ] && [ "$IS_PROD" = "true" ] && [ -z "$CLERK_KEY" ]; then
            echo "::error::Set NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY as a GitHub secret or variable before publishing production frontend images."
            exit 1
          fi
          {
            echo 'args<<BUILD_ARGS_EOF'
            if [ "${{ matrix.name }}" = "frontend" ]; then
              if [ "$IS_PROD" = "true" ]; then
                echo "NEXT_PUBLIC_API_URL=https://app.dheerajjoshi.dev"
              else
                echo "NEXT_PUBLIC_API_URL=http://localhost:8000"
              fi
              echo "NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY=${CLERK_KEY:-pk_test_placeholder}"
            fi
            echo 'BUILD_ARGS_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build ${{ matrix.name }} image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          build-args: ${{ steps.buildargs.outputs.args }}
          tags: |
            ${{ steps.image.outputs.ref }}:${{ github.sha }}
            ${{ steps.image.outputs.ref }}:latest
          # Scope per image. Sharing the default scope made three mode=max
          # exports overwrite each other, so every run started from a cold cache.
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}
          push: ${{ github.ref == 'refs/heads/main' && github.event_name == 'push' }}

      - name: Verify image
        if: github.ref != 'refs/heads/main' || github.event_name != 'push'
        run: docker images | grep docwise

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: 147.182.140.59
          username: root
          key: ${{ secrets.DROPLET_SSH_KEY }}
          # 45m total session budget (default 10m is too short for 3 builds)
          command_timeout: 45m
          script: |
            set -e
            APP_DIR="${{ secrets.DROPLET_APP_DIR }}"
            if [ -z "$APP_DIR" ]; then
              APP_DIR="/root/DocWise"
            fi
            cd "$APP_DIR"

            echo "==> Pulling latest code..."
            git fetch origin main
            git reset --hard origin/main

            if [ -f .env ]; then
              set -a
              . ./.env
              set +a
            fi

            echo "==> Pulling prebuilt images..."
            IMAGE_OWNER="$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
            IMAGE_TAG="${{ github.sha }}"

            export BACKEND_IMAGE="${{ env.REGISTRY }}/${IMAGE_OWNER}/docwise-backend:${IMAGE_TAG}"
            export WORKER_IMAGE="${{ env.REGISTRY }}/${IMAGE_OWNER}/docwise-worker:${IMAGE_TAG}"
            export FRONTEND_IMAGE="${{ env.REGISTRY }}/${IMAGE_OWNER}/docwise-frontend:${IMAGE_TAG}"

            echo "==> Persisting SHA-pinned Compose images..."
            if [ ! -f .env ]; then
              echo "::error::Production .env is missing at $APP_DIR/.env"
              exit 1
            fi
            persist_compose_image() {
              key="$1"
              value="$2"
              tmp="$(mktemp "$APP_DIR/.env.images.XXXXXX")"
              awk -F= -v key="$key" '$1 != key { print }' .env > "$tmp"
              printf '%s=%s\n' "$key" "$value" >> "$tmp"
              chmod --reference=.env "$tmp"
              chown --reference=.env "$tmp"
              mv "$tmp" .env
            }
            persist_compose_image BACKEND_IMAGE "$BACKEND_IMAGE"
            persist_compose_image WORKER_IMAGE "$WORKER_IMAGE"
            persist_compose_image FRONTEND_IMAGE "$FRONTEND_IMAGE"

            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u "${{ github.actor }}" --password-stdin
            timeout 5m docker compose pull backend worker frontend

            echo "==> Backing up PostgreSQL and MinIO before migration..."
            DOCWISE_APP_DIR="$APP_DIR" bash scripts/backup-data.sh

            echo "==> Running schema migration..."
            timeout 5m docker compose up --no-build --abort-on-container-exit migrate

            echo "==> Restarting containers..."
            timeout 5m docker compose up -d --no-build db redis minio backend worker beat frontend nginx

            echo "==> Backfilling owners, migrating legacy chats, and queuing reindexing..."
            timeout 10m docker compose exec -T backend python scripts/migrate_and_reindex.py --step all

            echo "==> Restarting nginx to resolve new container IPs..."
            docker compose restart nginx

            echo "==> Syncing and validating nginx storage proxy..."
            DOCWISE_VPS_APP_DIR="$APP_DIR" DOCWISE_PUBLIC_URL="https://app.dheerajjoshi.dev" bash scripts/sync-nginx-proxy.sh --local

            echo "==> Cleaning up old images..."
            docker image prune -f

            echo "==> Waiting for services to stabilize..."
            for attempt in $(seq 1 12); do
              if curl -sf https://app.dheerajjoshi.dev/api/ready; then
                break
              fi
              if [ "$attempt" -eq 12 ]; then
                # -f hides the body, so print the payload: it names which of
                # database/schema/objectStorage is holding the gate closed.
                echo "==> /api/ready never returned 200. Last payload:"
                curl -s https://app.dheerajjoshi.dev/api/ready || true
                echo
                docker compose logs --tail=80 backend nginx
                exit 1
              fi
              sleep 5
            done

            for attempt in $(seq 1 12); do
              if curl -sf https://app.dheerajjoshi.dev/ > /dev/null; then
                break
              fi
              if [ "$attempt" -eq 12 ]; then
                docker compose logs --tail=80 frontend nginx
                exit 1
              fi
              sleep 5
            done

            docker compose ps
            echo "==> Deployment complete!"
